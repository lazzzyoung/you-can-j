<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>month.do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#141414;--canvas:#fff;--soft:#f3f3f3;--field:#f0f0f0;--hl-soft:#f0f0f0;--hl:#e0e0e0;--muted:#707070;--faint:#adadad}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:450 16px/1.38 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--canvas);padding:16px 16px 80px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2{font-weight:650;line-height:1.13}

/* pills */
.btn{height:44px;padding:0 16px;border-radius:9999px;font-weight:600;white-space:nowrap}
.primary{background:var(--ink);color:#fff}
.outline{background:var(--canvas);border:1px solid var(--hl)}
.soft{background:var(--soft)}
.icon{width:44px;padding:0}

nav{position:sticky;top:12px;z-index:5;max-width:960px;margin:0 auto 48px;background:var(--soft);border-radius:9999px;padding:6px 6px 6px 20px;display:flex;align-items:center;gap:8px}
nav b{font-weight:650;flex:1}
nav .btn{height:40px}

main{max-width:960px;margin:0 auto}
.head{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.head h1{font-size:44px;flex:1}
.head small{display:block;font-size:20px;font-weight:300;color:var(--muted);margin-top:4px}

.bar{display:flex;justify-content:center;gap:8px;margin-top:24px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.day{min-height:96px;border:1px solid var(--hl-soft);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;background:var(--canvas)}
.day:hover{background:var(--soft)}
.day.pad{border:0;pointer-events:none}
.day .n{font-size:14px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:9999px}
.day.today .n{background:var(--ink);color:#fff}
/* starred day: rainbow border that slowly rotates */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.day.star{border:2px solid transparent;padding:7px;--rb:conic-gradient(from var(--a),#ff595e,#ffca3a,#8ac926,#1982c4,#6a4c93,#ff595e);background:linear-gradient(var(--canvas),var(--canvas)) padding-box,var(--rb) border-box;animation:spin 3s linear infinite}
.day.star:hover{background:linear-gradient(var(--soft),var(--soft)) padding-box,var(--rb) border-box}
@keyframes spin{to{--a:360deg}}
@media(prefers-reduced-motion:reduce){.day.star{animation:none}}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.starbtn{width:44px;height:44px;flex:none;border-radius:9999px;background:var(--soft);font-size:22px;line-height:1}
.starbtn[aria-pressed=true]{background:#ffd60a}
.chip{font-size:11px;font-weight:600;background:var(--soft);border-radius:9999px;padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.done{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);padding-left:6px}

dialog{margin:auto;border:0;border-radius:24px;padding:24px;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);color:var(--ink);background:var(--canvas)}
dialog::backdrop{background:rgba(20,20,20,.4)}
dialog h2{font-size:32px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}

.dial{position:relative;width:min(320px,100%);margin:0 auto 16px}
.dial svg{display:block;width:100%}
.dial .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 25%}
.mid b{font-size:20px;font-weight:650;line-height:1.2;word-break:keep-all}
.mid span{font-size:14px;color:var(--muted)}
.arc{cursor:pointer;fill:none;stroke-linecap:round}

.list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:10px 8px 10px 16px;cursor:pointer}
.row.sel{outline:2px solid var(--ink)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:12px;color:var(--muted)}
.row.done .t b{color:var(--faint);text-decoration:line-through}
.row input{width:20px;height:20px;accent-color:var(--ink)}
.row .x{width:32px;height:32px;border-radius:9999px;color:var(--muted)}
.row .x:hover{background:var(--hl)}
.empty{color:var(--muted);text-align:center;padding:16px}

form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input[type=text],input[type=email],input[type=time],input[type=number],input[type=date]{font:inherit;font-size:16px;font-weight:450;background:var(--field);border:0;border-radius:16px;padding:12px 16px;color:var(--ink);width:100%;min-width:0;max-width:100%;display:block;height:48px}
/* iOS: native date/time inputs ignore width unless appearance is reset */
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus{outline:2px solid var(--ink)}
input::placeholder{color:var(--faint)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.days{display:flex;gap:6px}
.days label{flex:1}
.days input{display:none}
.days span{display:grid;place-items:center;height:40px;border-radius:9999px;background:var(--soft);font-size:14px;font-weight:600;cursor:pointer}
.days input:checked+span{background:var(--ink);color:#fff}
.quick{display:flex;gap:6px}
.quick button{flex:1;height:36px;border-radius:9999px;background:var(--soft);font-size:14px;font-weight:600}
.actions{display:flex;gap:8px;margin-top:4px}
.actions .btn{flex:1}

.gdot{width:10px;height:10px;border-radius:9999px;flex:none;background:var(--hl)}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.groups input{display:none}
.groups span{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9999px;background:var(--soft);font-size:14px;font-weight:600;cursor:pointer}
.groups input:checked+span{outline:2px solid var(--ink)}
.grow{display:flex;align-items:center;gap:8px}
#gList .grow{background:var(--soft);border-radius:16px;padding:6px 6px 6px 8px}
#gList input[type=text]{background:transparent;padding:8px}
form.grow{flex-direction:row;margin:0 0 16px}
input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:1px solid var(--hl);border-radius:9999px}
input[type=color]::-moz-color-swatch{border:1px solid var(--hl);border-radius:9999px}
.google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.google svg{background:#fff;border-radius:9999px;padding:2px;width:22px;height:22px}
.or{text-align:center;font-size:12px;color:var(--muted);margin:16px 0 -4px}
footer{text-align:center;margin-top:48px;font-size:12px}
footer a{color:var(--faint)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:9999px;padding:10px 18px;font-size:14px;font-weight:600;z-index:10}
@media(max-width:640px){
  .head h1{font-size:32px}
  .day{min-height:64px;padding:4px;border-radius:12px}
  .day.star{padding:3px}
  .chip{display:none}
  .day .dots{display:flex;gap:3px;flex-wrap:wrap;padding-left:3px}
  .dot{width:5px;height:5px;border-radius:9999px;background:var(--ink)}
  .dot.done{background:var(--hl)}
  .more{display:none}
}
@media(min-width:641px){.dots{display:none}}
</style>
</head>
<body>
<nav>
  <b>month.do</b>
  <button class="btn soft" id="openGroups">Groups</button>
  <button class="btn outline" id="signOut" hidden>Sign out</button>
</nav>

<main>
  <div class="head">
    <h1 id="title"></h1>
    <button class="btn outline icon" id="prev" aria-label="Previous month">‹</button>
    <button class="btn outline icon" id="next" aria-label="Next month">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <button class="btn outline" id="addFixed">+ Routine</button>
    <button class="btn primary" id="addOnce">+ Event</button>
  </div>
</main>
<footer><a href="/privacy.html">Privacy</a></footer>

<dialog id="dayDlg">
  <div class="dhead">
    <div><h2 id="dayTitle"></h2><p class="sub" id="daySub"></p></div>
    <button class="starbtn" id="starBtn" aria-label="Mark as important" aria-pressed="false">☆</button>
  </div>
  <div class="dial" id="dial"></div>
  <div class="list" id="list"></div>
  <div class="actions">
    <button class="btn outline" id="dayClose">Close</button>
    <button class="btn primary" id="dayAdd">+ Add event</button>
  </div>
</dialog>

<dialog id="addDlg">
  <h2 id="addTitle"></h2>
  <p class="sub" id="addSub"></p>
  <form id="form">
    <label class="f">Name<input type="text" name="title" placeholder="e.g. Workout" required maxlength="40"></label>
    <div class="two">
      <label class="f">Start<input type="time" name="start" value="07:00" required></label>
      <label class="f">End<input type="time" name="end" value="07:00" required></label>
    </div>
    <div class="quick"><button type="button" data-add="10">+10m</button><button type="button" data-add="30">+30m</button><button type="button" data-add="60">+1h</button></div>
    <div class="f"><span style="font-size:14px;font-weight:600">Group</span>
      <div class="groups" id="groupPick"></div>
    </div>
    <div id="fixedF" class="f"><span style="font-size:14px;font-weight:600">Repeat on</span>
      <div class="days" style="margin-top:4px"></div>
    </div>
    <label class="f" id="onceF">Date<input type="date" name="date"></label>
    <div class="actions">
      <button type="button" class="btn outline" id="addCancel">Cancel</button>
      <button class="btn primary">Add</button>
    </div>
  </form>
</dialog>

<dialog id="delDlg">
  <h2>Delete routine.</h2>
  <p class="sub">Remove just this day, or every day it repeats?</p>
  <form method="dialog" class="actions" style="flex-direction:column">
    <button class="btn primary" value="one">Only this day</button>
    <button class="btn outline" value="all">All days</button>
    <button class="btn soft" value="">Cancel</button>
  </form>
</dialog>

<dialog id="loginDlg">
  <h2>Sign in.</h2>
  <p class="sub" id="loginSub">Sign in to sync your planner.</p>
  <button type="button" class="btn primary google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Continue with Google
  </button>
  <p class="or">or sign in with email</p>
  <form id="loginForm">
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
    <input type="text" name="code" placeholder="Code from email" inputmode="numeric" autocomplete="one-time-code" maxlength="10" hidden>
    <button class="btn outline" id="loginBtn">Send code</button>
  </form>
</dialog>
<div id="toast" hidden></div>

<dialog id="grpDlg">
  <h2>Groups.</h2>
  <p class="sub">Color-code events, e.g. Work in gray, Friends in yellow.</p>
  <form id="gForm" class="grow">
    <input type="color" name="color" value="#adadad" aria-label="Color">
    <input type="text" name="name" placeholder="New group" required maxlength="20">
    <button class="btn primary">Add</button>
  </form>
  <div class="list" id="gList"></div>
  <div class="actions"><button class="btn outline" id="grpClose">Done</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mins = t => +t.slice(0,2)*60 + +t.slice(3,5);
const hm = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// state: fixed = recurring {id,title,start,dur,days,skip:[dates]}; once = {id,date,title,start,dur}; done = {"date|id":1}; stars = {date:1}
// Supabase: paste Project URL + anon/publishable key (Settings → API). Empty = data stays in this browser only.
// Never put the service_role key here.
const SB_URL = 'https://htfzxxmkdqbpzqtxfoqj.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Znp4eG1rZHFicHpxdHhmb3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTczMzQsImV4cCI6MjEwOTE3MzMzNH0.ZpEI5OaEmD9FJQtaQUhTd7Sz8yyfFAo82R1zddmyQMk';
// session is kept in localStorage and refreshed automatically, so users stay signed in until they sign out
const sb = SB_URL && SB_KEY && window.supabase ? supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
// a fresh object every time, so one user's items never leak into the next sign-in
const empty = () => ({fixed:[], once:[], done:{}, groups:[], stars:{}});
let S = empty(), user = null, syncTimer;
const readLocal = k => { try { return JSON.parse(localStorage.getItem(k)); } catch {} };
const localKey = () => 'monthdo' + (user ? ':' + user.id : '');
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; setTimeout(() => t.hidden = true, 3000); };
const save = () => {
  try { localStorage.setItem(localKey(), JSON.stringify(S)); } catch {}
  if (!user) return;
  // ponytail: whole planner is one jsonb row, last write wins across devices; split into tables if multi-device edits clash
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    const { error } = await sb.from('planner').upsert({ user_id: user.id, data: S, updated_at: new Date().toISOString() });
    if (error) toast('Couldn’t sync. Saved on this device.');
  }, 400);
};

let cur = new Date(); cur.setDate(1);
let selDate = null, selId = null, addType = 'once';

const itemsOf = ds => {
  const dow = new Date(ds + 'T00:00').getDay();
  return [
    ...S.fixed.filter(f => f.days.includes(dow) && !f.skip?.includes(ds)).map(f => ({...f, fixed:true})),
    ...S.once.filter(o => o.date === ds)
  ].sort((a, b) => a.start.localeCompare(b.start));
};
const isDone = (ds, id) => !!S.done[ds + '|' + id];
const grp = id => S.groups.find(g => g.id === id);
// readable text on a group color
const onColor = hex => { const n = parseInt(hex.slice(1), 16); return .299*(n>>16) + .587*(n>>8&255) + .114*(n&255) > 150 ? '#141414' : '#fff'; };
const chipStyle = i => { const g = grp(i.group); return g ? ` style="background:${g.color};color:${onColor(g.color)}"` : ''; };

function renderMonth() {
  const y = cur.getFullYear(), m = cur.getMonth(), todayS = ymd(new Date());
  $('#title').textContent = `${MON[m]} ${y}.`;
  let h = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  h += '<div class="day pad"></div>'.repeat(cur.getDay());
  for (let d = 1, n = new Date(y, m+1, 0).getDate(); d <= n; d++) {
    const ds = `${y}-${pad(m+1)}-${pad(d)}`, it = itemsOf(ds);
    h += `<button class="day${ds === todayS ? ' today' : ''}${S.stars[ds] ? ' star' : ''}" data-d="${ds}"><span class="n">${d}</span>`
      + it.slice(0, 2).map(i => `<span class="chip${isDone(ds, i.id) ? ' done' : ''}"${chipStyle(i)}>${esc(i.title)}</span>`).join('')
      + (it.length > 2 ? `<span class="more">+${it.length - 2}</span>` : '')
      + `<span class="dots">${it.slice(0, 6).map(i => `<i class="dot${isDone(ds, i.id) ? ' done' : ''}"${grp(i.group) && !isDone(ds, i.id) ? ` style="background:${grp(i.group).color}"` : ''}></i>`).join('')}</span></button>`;
  }
  $('#grid').innerHTML = h;
}

// 24h dial: 00:00 at top, clockwise; overlapping items go on inner lanes
function renderDial(it) {
  const C = 160, R0 = 128, W = 16, STEP = 20;
  const laneEnds = [], lane = new Map();
  it.forEach(i => {
    const s = mins(i.start), e = Math.min(s + i.dur, 1440);
    let l = laneEnds.findIndex(end => end <= s);
    if (l < 0) l = laneEnds.length;
    laneEnds[l] = e; lane.set(i.id, l);
  });
  const pt = (r, m) => { const a = m / 1440 * 2 * Math.PI - Math.PI / 2; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  let svg = `<svg viewBox="0 0 320 320">`;
  for (let l = 0; l < Math.max(1, laneEnds.length); l++)
    svg += `<circle cx="${C}" cy="${C}" r="${R0 - l*STEP}" fill="none" stroke="#f3f3f3" stroke-width="${W}"/>`;
  for (let h = 0; h < 24; h += 3) {
    const [x, y] = pt(R0 + 26, h * 60);
    svg += `<text x="${x}" y="${y}" font-size="11" font-weight="600" fill="#707070" text-anchor="middle" dominant-baseline="central">${h}</text>`;
  }
  it.forEach(i => {
    const s = mins(i.start), e = Math.min(s + i.dur, 1439.9), r = R0 - lane.get(i.id) * STEP;
    const [x0, y0] = pt(r, s), [x1, y1] = pt(r, e);
    const col = isDone(selDate, i.id) ? '#e0e0e0' : grp(i.group)?.color || '#707070';
    svg += `<path class="arc" data-id="${i.id}" d="M${x0} ${y0}A${r} ${r} 0 ${e - s > 720 ? 1 : 0} 1 ${x1} ${y1}" stroke="${col}" stroke-width="${i.id === selId ? W + 4 : W}"${i.id === selId ? ' stroke-opacity="1"' : selId ? ' stroke-opacity=".35"' : ''}/>`;
  });
  const s = it.find(i => i.id === selId), dn = it.filter(i => isDone(selDate, i.id)).length;
  const mid = s
    ? `<b>${esc(s.title)}</b><span>${s.start}–${hm(mins(s.start) + s.dur)}</span>`
    : `<b>${it.length ? `${dn}/${it.length}` : 'Empty'}</b><span>${it.length ? 'done' : 'Add an event'}</span>`;
  $('#dial').innerHTML = svg + `</svg><div class="mid">${mid}</div>`;
}

function renderDay() {
  const it = itemsOf(selDate), d = new Date(selDate + 'T00:00');
  $('#dayTitle').textContent = `${MON[d.getMonth()].slice(0,3)} ${d.getDate()}.`;
  $('#daySub').textContent = d.toLocaleDateString('en-US', {weekday:'long'});
  $('#starBtn').textContent = S.stars[selDate] ? '★' : '☆';
  $('#starBtn').setAttribute('aria-pressed', !!S.stars[selDate]);
  renderDial(it);
  $('#list').innerHTML = it.length ? it.map(i => `
    <div class="row${i.id === selId ? ' sel' : ''}${isDone(selDate, i.id) ? ' done' : ''}" data-id="${i.id}">
      <input type="checkbox" ${isDone(selDate, i.id) ? 'checked' : ''} aria-label="Done">
      <i class="gdot"${grp(i.group) ? ` style="background:${grp(i.group).color}"` : ''}></i>
      <div class="t"><b>${esc(i.title)}</b><span>${i.start}–${hm(mins(i.start) + i.dur)}${i.fixed ? ' · Routine' : ''}${grp(i.group) ? ' · ' + esc(grp(i.group).name) : ''}</span></div>
      <button class="x" aria-label="Delete">✕</button>
    </div>`).join('') : '<p class="empty">Nothing planned.</p>';
}

const refresh = () => { renderMonth(); if ($('#dayDlg').open) renderDay(); };

// events
$('#prev').onclick = () => { cur.setMonth(cur.getMonth() - 1); renderMonth(); };
$('#next').onclick = () => { cur.setMonth(cur.getMonth() + 1); renderMonth(); };

$('#grid').onclick = e => {
  const b = e.target.closest('[data-d]'); if (!b) return;
  selDate = b.dataset.d; selId = null; renderDay(); $('#dayDlg').showModal();
};
$('#starBtn').onclick = () => { S.stars[selDate] ? delete S.stars[selDate] : S.stars[selDate] = 1; save(); refresh(); };
$('#dayClose').onclick = () => $('#dayDlg').close();
$('#dayDlg').onclick = e => { if (e.target.id === 'dayDlg') e.target.close(); };

$('#dial').onclick = e => {
  const a = e.target.closest('.arc'); if (!a) return;
  selId = selId === a.dataset.id ? null : a.dataset.id; renderDay();
};
$('#list').onclick = e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.dataset.id;
  if (e.target.matches('input')) { e.target.checked ? S.done[selDate + '|' + id] = 1 : delete S.done[selDate + '|' + id]; save(); return refresh(); }
  if (e.target.matches('.x')) {
    const f = S.fixed.find(f => f.id === id);
    if (f) return askDeleteRoutine(f);
    S.once = S.once.filter(o => o.id !== id);
    if (selId === id) selId = null; save(); return refresh();
  }
  selId = selId === id ? null : id; renderDay();
};

// routine delete: skip just this date, or remove the routine everywhere
function askDeleteRoutine(f) {
  const d = $('#delDlg');
  d.returnValue = '';
  d.onclose = () => {
    if (d.returnValue === 'one') (f.skip ||= []).push(selDate);
    else if (d.returnValue === 'all') S.fixed = S.fixed.filter(x => x !== f);
    else return;
    if (selId === f.id) selId = null;
    save(); refresh();
  };
  d.showModal();
}

function openAdd(type) {
  addType = type;
  $('#addTitle').textContent = type === 'fixed' ? 'New routine.' : 'New event.';
  $('#addSub').textContent = type === 'fixed' ? 'Repeats at the same time on the chosen weekdays.' : 'A one-time event on a single day.';
  $('#fixedF').hidden = type !== 'fixed';
  $('#onceF').hidden = type === 'fixed';
  $('#form').reset(); gap = 0;
  $('#groupPick').innerHTML = [{id:'', name:'None', color:''}, ...S.groups].map((g, k) =>
    `<label><input type="radio" name="group" value="${g.id}"${k ? '' : ' checked'}><span>${g.id ? `<i class="gdot" style="background:${g.color}"></i>` : ''}${esc(g.name)}</span></label>`).join('');
  $('#form').date.value = selDate && $('#dayDlg').open ? selDate : ymd(new Date());
  $('#addDlg').showModal();
}
$('#addFixed').onclick = () => openAdd('fixed');
$('#addOnce').onclick = () => openAdd('once');
$('#dayAdd').onclick = () => openAdd('once');
$('#addCancel').onclick = () => $('#addDlg').close();

// end time: moving start keeps the same length; quick buttons push the end later (capped at 23:59)
let gap = 0;
const setEnd = m => { const f = $('#form'); f.end.value = hm(Math.min(m, 1439)); gap = mins(f.end.value) - mins(f.start.value); };
$('#form').start.oninput = e => { if (e.target.value) setEnd(mins(e.target.value) + gap); };
$('#form').end.oninput = e => { if (e.target.value) gap = mins(e.target.value) - mins($('#form').start.value); };
$('.quick').onclick = e => {
  const n = +e.target.dataset.add, f = $('#form');
  if (n && f.start.value) setEnd(Math.max(mins(f.end.value || f.start.value), mins(f.start.value)) + n);
};

$('#fixedF .days').innerHTML = DOW.map((d, i) => `<label><input type="checkbox" value="${i}" checked><span>${d}</span></label>`).join('');

$('#form').onsubmit = e => {
  e.preventDefault();
  const f = e.target, base = { id: uid(), title: f.title.value.trim(), start: f.start.value, dur: mins(f.end.value) - mins(f.start.value), group: f.querySelector('[name=group]:checked')?.value || null };
  if (base.dur <= 0) return alert('End time must be after start time.');
  if (addType === 'fixed') {
    const days = [...f.querySelectorAll('.days input:checked')].map(i => +i.value);
    if (!days.length) return alert('Pick at least one weekday.');
    S.fixed.push({ ...base, days });
  } else {
    if (!f.date.value) return;
    S.once.push({ ...base, date: f.date.value });
  }
  save(); $('#addDlg').close(); refresh();
};

function renderGroups() {
  $('#gList').innerHTML = S.groups.length ? S.groups.map(g => `
    <div class="grow" data-id="${g.id}">
      <input type="color" value="${g.color}" aria-label="Color">
      <input type="text" value="${esc(g.name)}" maxlength="20" aria-label="Name">
      <button class="x" aria-label="Delete group">✕</button>
    </div>`).join('') : '<p class="empty">No groups yet.</p>';
}
$('#openGroups').onclick = () => { renderGroups(); $('#grpDlg').showModal(); };
$('#grpClose').onclick = () => $('#grpDlg').close();
$('#gForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  S.groups.push({ id: uid(), name: f.name.value.trim(), color: f.color.value });
  save(); f.reset(); renderGroups(); renderMonth();
};
$('#gList').oninput = e => {
  const g = grp(e.target.closest('.grow').dataset.id);
  if (e.target.type === 'color') g.color = e.target.value;
  else if (e.target.value.trim()) g.name = e.target.value.trim();
  save(); renderMonth();
};
$('#gList').onclick = e => {
  if (!e.target.matches('.x')) return;
  if (!confirm('Delete this group? Its events stay, without color.')) return;
  const id = e.target.closest('.grow').dataset.id;
  S.groups = S.groups.filter(g => g.id !== id);
  save(); renderGroups(); renderMonth();
};

// auth: email one-time code
function resetLogin() {
  const f = $('#loginForm');
  f.reset(); f.code.hidden = true; f.code.required = false; f.email.readOnly = false;
  $('#loginBtn').textContent = 'Send code';
  $('#loginSub').textContent = 'Sign in to sync your planner.';
}
$('#loginDlg').oncancel = e => e.preventDefault();
// Google: redirects away, Supabase returns here and getSession() picks the session up from the URL
$('#googleBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
  if (error) alert(error.message);
};
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, email = f.email.value.trim(), btn = $('#loginBtn');
  btn.disabled = true;
  if (f.code.hidden) {
    const { error } = await sb.auth.signInWithOtp({ email });
    if (error) alert(error.message);
    else {
      f.code.hidden = false; f.code.required = true; f.email.readOnly = true;
      btn.textContent = 'Sign in';
      $('#loginSub').textContent = `Enter the code sent to ${email}.`;
      f.code.focus();
    }
  } else {
    const { data, error } = await sb.auth.verifyOtp({ email, token: f.code.value.trim(), type: 'email' });
    if (error) alert(error.message);
    else { $('#loginDlg').close(); start(data.session); }
  }
  btn.disabled = false;
};
$('#signOut').onclick = async () => {
  try { localStorage.removeItem(localKey()); } catch {} // don't leave this user's planner on a shared device
  await sb.auth.signOut();
  start(null);
};

async function start(session) {
  user = session?.user || null;
  $('#signOut').hidden = !user;
  S = empty();
  if (sb && !user) { renderMonth(); resetLogin(); return $('#loginDlg').showModal(); }
  S = {...empty(), ...readLocal(localKey())};
  if (user) {
    const { data, error } = await sb.from('planner').select('data').maybeSingle();
    if (error) toast('Offline. Showing data saved on this device.');
    else if (data) S = {...empty(), ...data.data};
    else { S = {...empty(), ...readLocal('monthdo')}; save(); } // first sign-in: upload what was planned before login
  }
  renderMonth();
}
if (sb) sb.auth.getSession().then(({ data }) => start(data.session));
else start(null);
</script>
</body>
</html>
