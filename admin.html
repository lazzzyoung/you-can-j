<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · You can J</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* same look as the app: ink on white, soft gray panels, pills */
:root{--ink:#141414;--canvas:#fff;--soft:#f3f3f3;--hl:#e0e0e0;--muted:#707070;--faint:#adadad;--bar:#141414;--bar-dim:#adadad}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:450 15px/1.45 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--canvas);padding:32px 16px 80px}
main{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1{font-size:40px;font-weight:650;line-height:1.1}
h2{font-size:18px;font-weight:650;margin-bottom:12px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{flex:1}
.sub{color:var(--muted);font-size:13px}
select,button{font:inherit;font-size:14px;font-weight:600;height:36px;padding:0 14px;border-radius:9999px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
a{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--soft);border-radius:16px;padding:14px 16px}
.tile b{display:block;font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.card{min-width:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px;white-space:nowrap;transform:translate(-50%,-110%)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--hl)}
td{padding:7px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.meter{height:6px;border-radius:9999px;background:var(--soft);margin-top:4px}
.meter i{display:block;height:100%;border-radius:9999px;background:var(--ink)}
.who{border:0;background:var(--soft);border-radius:9999px;padding:1px 8px;font-size:12px;height:auto;font-weight:600}
.props{color:var(--muted);font-size:12px;word-break:break-all}
.msg{background:var(--soft);border-radius:16px;padding:24px;text-align:center}
.filter{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
</style>
</head>
<body>
<main>
  <div class="head">
    <div style="flex:1"><h1>Admin.</h1><p class="sub" id="updated">You can J usage</p></div>
    <select id="range" aria-label="Period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
    <button id="reload">Refresh</button>
  </div>

  <p class="msg" id="gate">Loading…</p>

  <div id="dash" hidden style="display:flex;flex-direction:column;gap:32px">
    <section class="tiles" id="tiles"></section>

    <section class="grid2">
      <div class="card"><h2>Visitors per day</h2><p class="sub" style="margin:-8px 0 8px">Different browsers that opened the app</p><div class="chart" id="cVisitors"></div></div>
      <div class="card"><h2>New accounts per day</h2><p class="sub" style="margin:-8px 0 8px">Sign-ups (Korea time)</p><div class="chart" id="cSignups"></div></div>
    </section>

    <section class="grid2">
      <div class="card"><h2>Funnel</h2><div id="funnel"></div></div>
      <div class="card"><h2>Who they are</h2><div id="mix"></div></div>
    </section>

    <section class="card"><h2>What they do</h2><div class="scroll" id="actions"></div></section>

    <section class="card">
      <h2>Recent activity</h2>
      <div class="filter" id="filterBar" hidden>Showing one person only · <button id="clearFilter" style="height:28px">Show everyone</button></div>
      <div class="scroll" id="recent"></div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const sb = supabase.createClient('https://htfzxxmkdqbpzqtxfoqj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0Znp4eG1rZHFicHpxdHhmb3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTczMzQsImV4cCI6MjEwOTE3MzMzNH0.ZpEI5OaEmD9FJQtaQUhTd7Sz8yyfFAo82R1zddmyQMk', { auth: { persistSession: true } });
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '–';
// days are counted in Korea time
const day = d => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
const LABEL = {
  visit: 'Opened the app', session: 'Started using (signed in or guest)', login_screen: 'Saw the sign-in screen',
  login_google: 'Tapped Google sign-in', login_code_sent: 'Requested an email code', guest_start: 'Started guest mode', guest_cancel: 'Backed out of guest mode',
  open_day: 'Opened a day', add_event: 'Added an event', add_routine: 'Added a routine', edit_event: 'Edited an event', edit_routine: 'Edited a routine',
  delete_event: 'Deleted an event', delete_routine: 'Deleted a routine', check_done: 'Checked something off', uncheck_done: 'Unchecked something',
  todo_add: 'Added a Someday to-do', todo_schedule: 'Scheduled a to-do', todo_done: 'Ticked a to-do', group_add: 'Made a group',
  reminders_on: 'Turned on reminders', reminders_blocked: 'Blocked notifications', lang_change: 'Changed language',
  month_prev: 'Went to previous month', month_next: 'Went to next month', open_guide: 'Opened How to use', open_privacy: 'Opened Privacy', sign_out: 'Signed out',
};
let events = [], stats = {}, only = null;

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return gate('Sign in on <a href="/">You can J</a> with the admin account first, then open this page again.');
  const days = +$('#range').value, since = new Date(Date.now() - days * 864e5).toISOString();
  const [st, ev] = await Promise.all([
    sb.rpc('admin_stats'),
    sb.from('events').select('at, device, user_id, name, props').gte('at', since).order('at', { ascending: false }).limit(20000),
  ]);
  if (st.error) return gate('This page is only for the site admin.');
  stats = st.data; events = ev.data || [];
  $('#gate').hidden = true; $('#dash').hidden = false;
  $('#updated').textContent = `Updated ${new Date().toLocaleString('en-US')} · ${fmt(events.length)} events in the last ${days} days`;
  render(days);
}
const gate = html => { $('#gate').innerHTML = html; $('#gate').hidden = false; $('#dash').hidden = true; };

function render(days) {
  const uniq = arr => new Set(arr).size;
  const by = name => events.filter(e => e.name === name);
  const visitors = uniq(by('visit').map(e => e.device));
  const added = uniq(events.filter(e => e.name === 'add_event' || e.name === 'add_routine').map(e => e.device));
  const started = uniq(by('session').map(e => e.device));
  const sawLogin = uniq(by('login_screen').map(e => e.device));

  const tile = (n, label) => `<div class="tile"><b>${n}</b><span>${label}</span></div>`;
  $('#tiles').innerHTML = [
    tile(fmt(stats.users), 'Accounts in total'),
    tile(fmt(stats.active7), 'Accounts signed in, last 7 days'),
    tile(fmt(visitors), `Visitors, last ${days} days`),
    tile(fmt(by('visit').length), 'Page opens'),
    tile(fmt(uniq(by('guest_start').map(e => e.device))), 'Tried guest mode'),
    tile(fmt(stats.devices), 'Devices with reminders on'),
  ].join('');

  // daily series over the whole period, zero-filled
  const range = [...Array(days)].map((_, i) => day(Date.now() - (days - 1 - i) * 864e5));
  const perDay = {};
  for (const e of by('visit')) (perDay[day(e.at)] ||= new Set()).add(e.device);
  bars($('#cVisitors'), range.map(d => ({ d, n: perDay[d]?.size || 0 })), 'visitors');
  bars($('#cSignups'), range.map(d => ({ d, n: stats.signups?.[d] || 0 })), 'new accounts');

  const step = (label, n, of) => `<tr><td>${label}<div class="meter"><i style="width:${of ? n / of * 100 : 0}%"></i></div></td><td class="n">${fmt(n)}</td><td class="n">${pct(n, of)}</td></tr>`;
  $('#funnel').innerHTML = `<table><thead><tr><th>Step (different browsers)</th><th class="n">People</th><th class="n">of visitors</th></tr></thead><tbody>
    ${step('Opened the app', visitors, visitors)}
    ${step('Saw the sign-in screen', sawLogin, visitors)}
    ${step('Got in (signed in or guest)', started, visitors)}
    ${step('Added a plan', added, visitors)}
    ${step('Turned on reminders', uniq(by('reminders_on').map(e => e.device)), visitors)}
  </tbody></table>`;

  const share = (title, rows) => `<tr><th colspan="3">${title}</th></tr>` + rows.map(([k, n]) => `<tr><td>${esc(k)}</td><td class="n">${fmt(n)}</td><td class="n">${pct(n, visitors)}</td></tr>`).join('');
  const lastVisit = {};
  for (const e of [...by('visit')].reverse()) lastVisit[e.device] = e.props || {};
  const v = Object.values(lastVisit), count = f => v.filter(f).length;
  const NAMES = { en: 'English', ko: '한국어', ja: '日本語' };
  const langs = Object.entries(v.reduce((m, p) => { const k = NAMES[p.lang] || p.lang || '?'; m[k] = (m[k] || 0) + 1; return m; }, {}));
  const refs = Object.entries(v.reduce((m, p) => (p.ref && (m[p.ref] = (m[p.ref] || 0) + 1), m), {})).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('#mix').innerHTML = `<table><tbody>
    ${share('Signed in or guest', [['Signed-in account', uniq(events.filter(e => e.user_id).map(e => e.device))], ['Guest', uniq(by('guest_start').map(e => e.device))]])}
    ${share('Language', langs)}
    ${share('Device', [['Phone / tablet', count(p => p.mobile)], ['Computer', count(p => !p.mobile)], ['From the Home Screen icon', count(p => p.app)]])}
    ${refs.length ? share('Came from', refs) : ''}
  </tbody></table>`;

  const counts = {};
  for (const e of events) { const c = counts[e.name] ||= { n: 0, d: new Set() }; c.n++; c.d.add(e.device); }
  $('#actions').innerHTML = `<table><thead><tr><th>Action</th><th class="n">Times</th><th class="n">People</th></tr></thead><tbody>${
    Object.entries(counts).sort((a, b) => b[1].n - a[1].n).map(([k, c]) => `<tr><td>${esc(LABEL[k] || k)}</td><td class="n">${fmt(c.n)}</td><td class="n">${fmt(c.d.size)}</td></tr>`).join('')
  }</tbody></table>`;
  renderRecent();
}

// people are shown by a short code from their browser id; accounts get "Account", guests and visitors "Browser"
const who = e => (e.user_id ? 'Account ' + e.user_id.slice(0, 4) : 'Browser ' + e.device.slice(-4));
function renderRecent() {
  const list = (only ? events.filter(e => e.device === only) : events).slice(0, only ? 500 : 150);
  $('#filterBar').hidden = !only;
  $('#recent').innerHTML = `<table><thead><tr><th>When (Korea time)</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>${
    list.map(e => `<tr><td style="white-space:nowrap">${new Date(e.at).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
      <td><button class="who" data-dev="${esc(e.device)}" title="Show only this person">${esc(who(e))}</button></td>
      <td>${esc(LABEL[e.name] || e.name)}</td>
      <td class="props">${Object.keys(e.props || {}).length ? esc(Object.entries(e.props).map(([k, v]) => `${k}: ${v}`).join(' · ')) : ''}</td></tr>`).join('')
  }</tbody></table>`;
}
$('#recent').onclick = e => { const b = e.target.closest('[data-dev]'); if (b) { only = b.dataset.dev; renderRecent(); } };
$('#clearFilter').onclick = () => { only = null; renderRecent(); };

// one-series bar chart with a hover tooltip; bars sit on a shared baseline, 4px rounded tops
function bars(el, data, unit) {
  const W = 600, H = 180, P = { l: 28, r: 4, t: 8, b: 22 }, max = Math.max(1, ...data.map(x => x.n));
  const top = Math.max(1, Math.ceil(max / 4) * 4), cw = (W - P.l - P.r) / data.length, bw = Math.max(2, cw - 2);
  const y = n => P.t + (H - P.t - P.b) * (1 - n / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} per day">`;
  for (const v of [0, top / 2, top]) svg += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#f0f0f0"/><text x="${P.l - 6}" y="${y(v)}" font-size="10" fill="#707070" text-anchor="end" dominant-baseline="central">${v}</text>`;
  data.forEach((x, i) => {
    const bx = P.l + i * cw + (cw - bw) / 2, by = y(x.n), h = H - P.b - by, r = Math.min(4, bw / 2, h);
    if (x.n) svg += `<path d="M${bx} ${H - P.b}V${by + r}q0 -${r} ${r} -${r}h${bw - 2 * r}q${r} 0 ${r} ${r}V${H - P.b}z" fill="var(--bar)"/>`;
    svg += `<rect x="${P.l + i * cw}" y="${P.t}" width="${cw}" height="${H - P.t - P.b}" fill="transparent" data-i="${i}"/>`;
  });
  const lab = i => data[i].d.slice(5).replace('-', '/');
  const ticks = [0, Math.floor((data.length - 1) / 2), data.length - 1];
  for (const i of new Set(ticks)) svg += `<text x="${P.l + i * cw + cw / 2}" y="${H - 6}" font-size="10" fill="#707070" text-anchor="middle">${lab(i)}</text>`;
  el.innerHTML = svg + `</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  el.querySelector('svg').onmousemove = e => {
    const i = e.target.dataset?.i; if (i == null) return (tip.hidden = true);
    const r = el.getBoundingClientRect(), x = data[i];
    tip.textContent = `${lab(i)} · ${x.n} ${unit}`; tip.hidden = false;
    tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
  };
  el.querySelector('svg').onmouseleave = () => tip.hidden = true;
}

$('#range').onchange = $('#reload').onclick = load;
load();
</script>
</body>
</html>
